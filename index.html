<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WC2026 Family Sweepstake</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--dark:#080f0a;--card:#111c13;--card2:#162018;--border:#1e3022;--gold:#f0c040;--gold2:#e09020;--green:#3ecf6a;--red:#f05050;--text:#d8eedc;--muted:#6a8870;--t1:#f0c040;--t2:#3ecf6a;--t3:#60b0f0;--t4:#f08030}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dark);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(62,207,106,.07) 0%,transparent 60%),repeating-linear-gradient(0deg,transparent,transparent 40px,rgba(255,255,255,.012) 40px,rgba(255,255,255,.012) 41px),repeating-linear-gradient(90deg,transparent,transparent 40px,rgba(255,255,255,.012) 40px,rgba(255,255,255,.012) 41px)}
header{padding:2rem 1rem 1.2rem;text-align:center}
.header-flag{font-size:3.5rem;line-height:1;margin-bottom:.5rem;filter:drop-shadow(0 0 24px rgba(240,192,64,.5))}
h1{font-family:'Teko',sans-serif;font-weight:700;font-size:clamp(3rem,9vw,6rem);letter-spacing:.04em;line-height:.9;color:var(--gold);text-shadow:0 0 40px rgba(240,192,64,.3)}
.header-sub{font-weight:300;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:.5rem}
.live-bar{display:flex;align-items:center;justify-content:center;gap:.6rem;padding:.5rem;font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--border)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;animation:livepulse 2s infinite}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.main{max-width:700px;margin:0 auto;padding:1.2rem .8rem 4rem}
/* PODIUM */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem;margin-bottom:1.5rem}
.podium-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.2rem .8rem;text-align:center;position:relative;overflow:hidden;transition:transform .2s}
.podium-card:hover{transform:translateY(-2px)}
.podium-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.podium-card.p1{border-color:rgba(240,192,64,.4)}.podium-card.p1::before{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.podium-card.p2{border-color:rgba(192,192,192,.3)}.podium-card.p2::before{background:#c0c0c0}
.podium-card.p3{border-color:rgba(205,127,50,.3)}.podium-card.p3::before{background:#cd7f32}
.podium-medal{font-size:1.8rem;margin-bottom:.3rem}
.podium-name{font-family:'Teko',sans-serif;font-size:1.4rem;font-weight:600;letter-spacing:.04em;color:var(--text)}
.podium-pts{font-family:'Teko',sans-serif;font-size:2.6rem;font-weight:700;color:var(--gold);line-height:1}
.podium-label{font-size:.65rem;color:var(--muted);margin-top:.15rem;letter-spacing:.05em}
.podium-teams{margin-top:.5rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.2rem}
/* LEADERBOARD */
.lb-section-title{font-family:'Teko',sans-serif;font-size:1.3rem;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:.5rem 0 .6rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
.lb-row{display:flex;align-items:center;gap:.8rem;padding:.9rem .6rem;border-bottom:1px solid var(--border);transition:background .15s;cursor:default}
.lb-row:hover{background:var(--card2)}
.lb-rank{font-family:'Teko',sans-serif;font-size:1.5rem;color:var(--muted);width:2rem;text-align:center;flex-shrink:0}
.lb-rank.top{color:var(--gold)}
.lb-name{font-weight:600;font-size:.95rem;flex:1}
.lb-teams{display:flex;flex-wrap:wrap;gap:.2rem;margin-top:.25rem}
.tier-chip{display:inline-block;font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.1rem .35rem;border-radius:3px;margin:0;border:1px solid}
.tc-1{color:var(--t1);border-color:rgba(240,192,64,.3);background:rgba(240,192,64,.08)}
.tc-2{color:var(--t2);border-color:rgba(62,207,106,.3);background:rgba(62,207,106,.08)}
.tc-3{color:var(--t3);border-color:rgba(96,176,240,.3);background:rgba(96,176,240,.08)}
.tc-4{color:var(--t4);border-color:rgba(240,128,48,.3);background:rgba(240,128,48,.08)}
.tc-elim{color:var(--muted);border-color:var(--border);background:transparent;opacity:.35;text-decoration:line-through}
.lb-right{text-align:right;flex-shrink:0}
.lb-pts{font-family:'Teko',sans-serif;font-size:1.6rem;color:var(--gold)}
.lb-breakdown{font-size:.65rem;color:var(--muted)}
.lb-bar-wrap{display:flex;align-items:center;gap:.4rem;margin-top:.2rem}
.lb-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden;min-width:50px}
.lb-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));border-radius:2px;transition:width .6s ease}
/* RECENT */
.recent-title{font-family:'Teko',sans-serif;font-size:1.3rem;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin:1.5rem 0 .6rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
.event-item{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--border);font-size:.82rem}
.event-item:last-child{border-bottom:none}
.event-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.event-text{flex:1;color:var(--text)}.event-sub{font-size:.68rem;color:var(--muted)}
.event-pts{font-family:'Teko',sans-serif;font-size:1.15rem;color:var(--gold);flex-shrink:0}
/* LOADING */
.loading{text-align:center;padding:3rem 1rem;color:var(--muted)}
.loading-spinner{font-size:2.5rem;animation:spin 1.5s linear infinite;display:block;margin-bottom:1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.last-updated{text-align:center;font-size:.7rem;color:var(--muted);padding:.8rem;letter-spacing:.05em}
@media(max-width:480px){.podium{grid-template-columns:1fr 1fr 1fr;gap:.4rem}.podium-name{font-size:1.1rem}.podium-pts{font-size:2rem}}
</style>
</head>
<body>
<header>
  <div class="header-flag">🏆</div>
  <h1>World Cup 2026</h1>
  <div class="header-sub">Family Sweepstake · Live Leaderboard</div>
</header>

<div class="live-bar">
  <div class="live-dot"></div>
  <span id="live-status">Connecting...</span>
</div>

<div class="main">
  <div id="loading" class="loading">
    <span class="loading-spinner">⚽</span>
    Loading leaderboard...
  </div>
  <div id="content" style="display:none">
    <div class="podium" id="podium"></div>
    <div class="lb-section-title">Full Standings</div>
    <div id="standings"></div>
    <div class="recent-title">Recent Points</div>
    <div id="recent"></div>
    <div class="last-updated" id="last-updated"></div>
  </div>
</div>

<script>
const BIN_ID = '6a26a07eda38895dfe9931b9';
const READ_KEY = '$2a$10$Vnlf0Us03cYVi5vP8MnAR.dSsply7pXYS4l4tkjCknAb7hKA.CEiq';
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
const REFRESH_MS = 30000; // refresh every 30 seconds

const TIERS={1:{teams:["France","Spain","England","Argentina","Brazil","Portugal","Germany","Netherlands","Norway","Belgium","Colombia","Morocco"]},2:{teams:["USA","Japan","Uruguay","Croatia","Ecuador","Mexico","Senegal","Sweden","Switzerland","Turkey","Austria","Canada"]},3:{teams:["Paraguay","Czech Republic","Ivory Coast","Algeria","Bosnia","Egypt","Ghana","South Korea","Scotland","Australia","Iran","Tunisia"]},4:{teams:["DR Congo","Cape Verde","Iraq","Jordan","New Zealand","Panama","Qatar","Saudi Arabia","South Africa","Uzbekistan","Curaçao","Haiti"]}};

function getTeamTier(team){for(const[t,d]of Object.entries(TIERS))if(d.teams.includes(team))return parseInt(t);return 1;}
function totalPts(p,events){return events.filter(e=>e.player===p.name).reduce((s,e)=>s+e.pts,0);}
function breakdownPts(p,events){let team=0,wc=0,bonus=0;events.filter(e=>e.player===p.name).forEach(e=>{if(e.type==='team')team+=e.pts;else if(e.type==='wildcard')wc+=e.pts;else bonus+=e.pts;});return{team,wc,bonus};}
function teamChip(team,eliminated){const tier=getTeamTier(team),elim=eliminated.includes(team);return`<span class="tier-chip ${elim?'tc-elim':'tc-'+tier}">${team}</span>`;}

function render(state){
  const {players=[],events=[],eliminated=[]}=state;
  const sorted=[...players].sort((a,b)=>totalPts(b,events)-totalPts(a,events));
  const maxPts=Math.max(...sorted.map(p=>totalPts(p,events)),1);

  // Podium
  const medals=['🥇','🥈','🥉'],pc=['p1','p2','p3'];
  document.getElementById('podium').innerHTML=sorted.slice(0,3).map((p,i)=>{
    const pts=totalPts(p,events),bd=breakdownPts(p,events);
    const chips=(p.teams||[]).map(t=>teamChip(t,eliminated)).join('');
    return`<div class="podium-card ${pc[i]}">
      <div class="podium-medal">${medals[i]}</div>
      <div class="podium-name">${p.name}</div>
      <div class="podium-pts">${pts}</div>
      <div class="podium-label">Team ${bd.team} · WC ${bd.wc} · Bonus ${bd.bonus}</div>
      <div class="podium-teams">${chips}</div>
    </div>`;
  }).join('');

  // Full standings
  document.getElementById('standings').innerHTML=sorted.map((p,i)=>{
    const pts=totalPts(p,events),pct=Math.round((pts/maxPts)*100);
    const bd=breakdownPts(p,events);
    const chips=(p.teams||[]).map(t=>teamChip(t,eliminated)).join('');
    return`<div class="lb-row">
      <div class="lb-rank ${i<3?'top':''}">${i+1}</div>
      <div style="flex:1">
        <div class="lb-name">${p.name}</div>
        <div class="lb-teams">${chips}</div>
        <div class="lb-bar-wrap"><div class="lb-bar"><div class="lb-bar-fill" style="width:${pct}%"></div></div></div>
      </div>
      <div class="lb-right">
        <div class="lb-pts">${pts}</div>
        <div class="lb-breakdown">T:${bd.team} W:${bd.wc} B:${bd.bonus}</div>
      </div>
    </div>`;
  }).join('');

  // Recent events (last 15)
  const colors={team:'var(--green)',wildcard:'var(--gold)',bonus:'var(--blue)'};
  const recent=events.slice(0,15);
  document.getElementById('recent').innerHTML=recent.length
    ?recent.map(e=>`<div class="event-item">
        <div class="event-dot" style="background:${colors[e.type]||'var(--muted)'}"></div>
        <div class="event-text">
          <div style="font-weight:600">${e.player}</div>
          <div class="event-sub">${e.reason}${e.team?' · '+e.team:''}</div>
        </div>
        <div class="event-pts">+${e.pts}</div>
      </div>`).join('')
    :'<div style="color:var(--muted);font-size:.85rem;padding:.4rem 0">No events yet — tournament hasn\'t started!</div>';

  document.getElementById('last-updated').textContent=`Last updated: ${new Date().toLocaleTimeString('en-GB')} · Refreshes every 30s`;
  document.getElementById('loading').style.display='none';
  document.getElementById('content').style.display='block';
}

async function fetchData(){
  try{
    document.getElementById('live-status').textContent='Updating...';
    const r=await fetch(BIN_URL,{headers:{'X-Master-Key':READ_KEY}});
    const data=await r.json();
    render(data.record);
    document.getElementById('live-status').textContent='Live · Updates every 30s';
  }catch(e){
    document.getElementById('live-status').textContent='Connection error — retrying...';
    document.getElementById('loading').innerHTML='<span style="font-size:2rem">⚠️</span><br>Unable to load — check your connection';
  }
}

fetchData();
setInterval(fetchData, REFRESH_MS);
</script>
</body>
</html>
